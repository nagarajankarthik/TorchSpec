# Configuration for train_entry.py with vLLM Engine inference (nested config format)
# Adapted from configs/vllm_qwen3_5_35b.yaml.
#
# GPU allocation:
#   - 2 GPUs for inference (2 inference GPUs total, TP=1 per engine)
#   - 2 GPUs for training (DP/FSDP across 2 GPUs)
#   - Total: 4 GPUs
#
# Installation:
#   pip install -e ".[vllm]"  # Install vLLM backend
#
# Usage:
#   python -m torchspec.train_entry --config configs/vllm_qwen3_5_35b.yaml
#
# Note: Uses vLLM's extract_hidden_states speculative method with MooncakeHiddenStatesConnector.

model:
  target_model_path: nvidia/NVIDIA-Nemotron-3-Super-120B-A12B-BF16
  embedding_key: backbone.embeddings.weight
  lm_head_key: lm_head.weight
  norm_key: backbone.norm_f.weight
  trust_remote_code: true

dataset:
  train_data_path: /mnt/weka/aisg/users/karthik/model_training_team/data_bank/torchspec/test.parquet
  eval_data_path: null
  eval_interval: 1000
  # chat_template is not used for 
  # pre-tokenized datasets
  chat_template: qwen
  prompt_key: conversations
  defer_tokenization: false

training:
  num_epochs: 2
  max_seq_length: 16384
  max_concurrent_batches: 32

# Read by this path (train_entry -> AsyncInferenceManager -> VLLMClient):
#   inference_engine_type, max_sample_pool_size, inference_buffer_threshold,
#   inference_batch_size, aux_hidden_states_layers, vllm.endpoints, vllm.timeout_s
# Also read but not set here: inference_fetch_batch (defaults to 1).
#
# Removed (per the old TODO, now confirmed unread on this path): inference_num_gpus,
# inference_num_gpus_per_engine, inference_num_gpus_per_node -- these only fed the
# Ray placement groups, which we no longer use.
#
# vllm.tp_size and vllm.extra_args are likewise unread here (they belong to the
# Ray-managed VllmEngine); they are kept only as documentation of the
# `vllm serve` invocation in launch.sh and must be kept in sync with it by hand.
inference:
  inference_engine_type: vllm
  max_sample_pool_size: 64
  inference_buffer_threshold: 32
  inference_batch_size: 1
  # Post-layer semantics. launch.sh must pass [id + 1 for id in this list] plus
  # the model's num_hidden_layers (88) as eagle_aux_hidden_state_layer_ids,
  # i.e. [5, 30, 60, 88]. len(this list) must equal mooncake.num_aux_layers.
  aux_hidden_states_layers: [4, 29, 59]
  vllm:
    endpoints: ["http://127.0.0.1:8080"]
    timeout_s: 1800.0
    # Mirrors launch.sh -- not read here.
    tp_size: 2
    extra_args:
      max_num_batched_tokens: 65536
      enable_chunked_prefill: true
      enforce_eager: true

mooncake:
  protocol: rdma
  # TODO: Verify this by running ibv_devinfo
  device_name: mlx5_0
  hidden_dim: 4096
  max_seq_len: 16384
  num_aux_layers: 3
  global_segment_size: 64GB
  local_buffer_size: 8GB
  master_server_address: null
  master_port: 8011
  metadata_server: null
  metadata_port: 8012

output_dir: ./outputs/nemotron_3_120b_test
cache_dir: ./cache/nemotron_3_120b_test
model_download_dir: null

debug:
  save_debug_train_data: null
